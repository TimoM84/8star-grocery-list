# 8star Grocery List — Docker Compose stack (managed through Dockhand).
# Private network/VPN only: the port is bound to BIND_ADDRESS, never to a public interface.
name: 8star-grocery

services:
  app:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-}
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: 8star-grocery-list:${APP_VERSION:-1.1.0}
    pull_policy: build
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000'
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      # Accent color, applied at runtime: change it and recreate the container (no rebuild).
      APP_PRIMARY_COLOR: '${APP_PRIMARY_COLOR:-#1D7F46}'
      ORIGIN: ${ORIGIN:-}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - grocery-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

volumes:
  grocery-data:
    name: ${DATA_VOLUME:-8star-grocery-data}
